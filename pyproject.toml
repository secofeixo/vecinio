[project]
name = "vecinio"
version = "0.1.0"
description = "Gestión de comunidades de vecinos"
authors = [{ name = "Alberto Seco", email = "secofeixo@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.18.5",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "testcontainers>=4.8,<5.0",
    "httpx>=0.27,<0.28",
    "commitizen>=4.16.5",
    "detect-secrets>=1.5.0",
    "pydocstyle>=6.3.0",
    "pre-commit>=4.6.1",
    "flake8>=7.3.0",
    "flake8-bugbear>=25.11.29",
    "mypy>=2.3.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "pyupgrade>=3.21.2",
    "complexipy>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"
filter_files = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/", "migrations/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
